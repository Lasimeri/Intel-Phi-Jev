[package]
name = "xks"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "XKEYSCORE for Jev: typed System One judgments (noul / choice / score) on this host and its Xeon Phi cards, one prefill per session"
readme = "README.md"
repository = "https://github.com/Lasimeri/Intel-Phi-Jev"
build = "build.rs"

[lib]
name = "xks"
path = "src/lib.rs"

[[bin]]
name = "xks"
path = "src/main.rs"

[features]
default = ["artichoke"]
# ARTICHOKE: the in-process llama.cpp engine (bindgen over llama.h, links
# libllama from a llama.cpp build; LLAMA_CPP_DIR and LLAMA_BUILD_DIR).
artichoke = ["dep:bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", features = ["json"] }
clap = { version = "4", features = ["derive", "env"] }
tiny_http = "0.12"
thiserror = "1"

[build-dependencies]
bindgen = { version = "0.72", optional = true }

[profile.release]
opt-level = 3
lto = "thin"

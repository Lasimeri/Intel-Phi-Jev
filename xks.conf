# xks defaults. Every key is also an environment variable, and anything
# already in the environment wins. To change one on this machine only, put
# the key in xks.local.conf (not tracked) or ~/.config/xks/xks.conf.
# The file is shell-sourceable. See config.md.

# The subject ARTICHOKE interrogates, and the small dense one the parity
# and trie subprojects use.
XKS_SUBJECT="$HOME/models/Qwen3.8-35B-A3B/Qwen3.8-35B-A3B-Q4_K_M.gguf"
XKS_SUBJECT_SMALL="$HOME/models/tiny/qwen2.5-0.5b-instruct-fp16.gguf"

# Where the subject runs: auto | x86 | cards | avx512 (site.md).
XKS_SITE=auto

# serve: address, and the kill date: seconds without a question after
# which the server exits, gives back the cards it used and frees the host's
# memory (the 35B holds 11 to 13 GiB). Mechanical Jev starts it again with
# the next question. 0 = never; 1800 = 30 minutes.
XKS_BIND=127.0.0.1:8090
XKS_KILL_DATE=1800

# BLUEBIRD, the llama-server baseline the subprojects compare against.
XKS_LLAMA_SERVER="$HOME/llama.cpp/build-native/bin/llama-server"
XKS_BLUEBIRD_PORT=8089
XKS_BACKEND_URL=http://127.0.0.1:8089

# The sibling repository with the payload, the card workers and phi512
# (Intel-Phi-AVX512). Found without this key: a checkout next to this one,
# or in $HOME, named Intel-Phi-AVX512 or "Intel Phi AVX-512" (site.md).
# Set it only for a checkout somewhere else:
#   PHI_AVX512_ROOT="/path/to/Intel-Phi-AVX512"

# The real Jev (TypeSafe's hosted model, `--backend-kind jev`, `make jev`)
# needs an API key from console.typesafe.ai. Put it in xks.local.conf, which
# is not tracked, never in this file:
#   TYPESAFE_API_KEY=...

# How fingerprints are laid out: letters (lettered options) or jev (the
# layout reconstructed from Jev's documentation). And how many rotations of
# a Choice's options to average: 3 took the local subject from 27 to all 28
# of Jev's published decisions (Mechanical Jev, make closeness).
XKS_LAYOUT=letters
XKS_PERMUTATIONS=3
